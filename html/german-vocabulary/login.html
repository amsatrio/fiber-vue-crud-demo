<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · German Nomen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #FFDE59;
            --off-white: #FDF6EC;
            --ink: #1C1C1C;
            --red: #FF6B6B;
            --blue: #4D96FF;
            --green: #6BCB77;
            --border-w: 3px;
            --shadow: 6px 6px 0 0 var(--ink);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--off-white);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--off-white);
            border: var(--border-w) solid var(--ink);
            box-shadow: 8px 8px 0 0 var(--ink);
        }

        .login-head {
            background: var(--yellow);
            border-bottom: var(--border-w) solid var(--ink);
            padding: 22px 24px;
        }

        .login-head h1 {
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        .login-head p {
            font-size: 0.9rem;
            margin-top: 4px;
            opacity: 0.9;
        }

        .login-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            padding: 12px 14px;
            border: var(--border-w) solid var(--ink);
            background: #fff;
            outline: none;
            transition: box-shadow 0.08s;
        }

        .form-group input:focus {
            box-shadow: 4px 4px 0 0 var(--ink);
        }

        .error-msg {
            display: none;
            background: var(--red);
            border: var(--border-w) solid var(--ink);
            padding: 12px 14px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 18px;
            box-shadow: 4px 4px 0 0 var(--ink);
        }

        .error-msg.show {
            display: block;
        }

        .btn {
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 12px 20px;
            border: var(--border-w) solid var(--ink);
            background: var(--green);
            box-shadow: 4px 4px 0 0 var(--ink);
            cursor: pointer;
            width: 100%;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 0 var(--ink);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 0 var(--ink);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-foot {
            padding: 16px 24px 24px;
            text-align: center;
            font-size: 0.85rem;
        }

        .login-foot a {
            color: var(--ink);
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .login-foot a:hover {
            color: var(--blue);
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="login-head">
            <h1>German Nomen Login</h1>
            <p>Sign in to add, edit, or delete flashcards.</p>
        </div>
        <div class="login-body">
            <div class="error-msg" id="errorMsg"></div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"
                        required>
                </div>
                <button class="btn" type="submit" id="loginBtn">Login</button>
            </form>
        </div>
        <div class="login-foot">
            <a href="/">← Back to flashcards</a>
        </div>
    </div>

    <script>
        const TOKEN_KEY = 'auth_main_token';

        // Already signed in? Go straight to the app.
        if (localStorage.getItem(TOKEN_KEY)) {
            window.location.replace('/');
        }

        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!username || !password) {
                showError('Please fill in both username and password.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            hideError();

            try {
                const res = await fetch('/v1/hospital/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const json = await res.json();

                if (!res.ok) {
                    showError(json.message || json.error || 'Invalid credentials.');
                    return;
                }

                const data = json.data;
                if (data && data.mainToken) {
                    localStorage.setItem(TOKEN_KEY, data.mainToken);
                    if (data.refreshToken) {
                        localStorage.setItem('auth_refresh_token', data.refreshToken);
                    }
                    window.location.replace('/german-vocabulary/nomen');
                } else {
                    showError('Login succeeded but no token was returned.');
                }
            } catch (err) {
                showError('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorMsg').classList.remove('show');
        }
    </script>
</body>

</html>
