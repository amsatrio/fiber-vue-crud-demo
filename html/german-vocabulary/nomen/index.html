<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Nomen Flashcards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/german-vocabulary/nomen/nomen.css">
</head>

<body>

    <header>
        <h1>German Nomen <span class="dot">•</span> Flashcards</h1>
        <div class="header-actions">
            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="Search nouns..." />
                <button class="btn btn-yellow" onclick="doSearch()">Go</button>
            </div>
            <button id="addNomenBtn" class="btn btn-green" onclick="openCreateModal()">+ Add Nomen</button>
            <button id="authBtn" class="btn btn-blue" onclick="toggleAuth()"></button>
        </div>
    </header>

    <div class="stats-bar" id="statsBar"></div>

    <div class="toolbar">
        <div class="filter-group">
            <label>Gender</label>
            <select id="filterGender" onchange="applyFilters()">
                <option value="">All Genders</option>
                <option value="masculine">der · Masculine</option>
                <option value="feminine">die · Feminine</option>
                <option value="neuter">das · Neuter</option>
                <option value="plural_only">Plural Only</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Level</label>
            <select id="filterLevel" onchange="applyFilters()">
                <option value="">All Levels</option>
                <option value="A1">A1</option>
                <option value="A2">A2</option>
                <option value="B1">B1</option>
                <option value="B2">B2</option>
                <option value="C1">C1</option>
                <option value="C2">C2</option>
            </select>
        </div>
        <div class="filter-group">
            <label>N-Deklination</label>
            <select id="filterNDek" onchange="applyFilters()">
                <option value="">All</option>
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Sort By</label>
            <select id="filterSort" onchange="applySort()">
                <option value="createdAt|desc">Newest First</option>
                <option value="createdAt|asc">Oldest First</option>
                <option value="singular|asc">Singular (A–Z)</option>
                <option value="singular|desc">Singular (Z–A)</option>
                <option value="level|asc">Level (A–C)</option>
                <option value="translationEn|asc">Translation (A–Z)</option>
            </select>
        </div>
        <button class="btn btn-yellow" onclick="resetFilters()">Reset</button>
    </div>

    <div class="active-filters" id="activeFilters"></div>

    <main>
        <div class="spinner" id="spinner"></div>
        <div class="grid" id="grid"></div>
        <div class="pagination" id="pagination"></div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add Nomen</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="nounForm">
                    <input type="hidden" id="nounId">
                    <div class="form-group">
                        <label>Singular (e.g. "Hund") *</label>
                        <input type="text" id="fSingular" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Gender *</label>
                            <select id="fGender" required>
                                <option value="masculine">Masculine (der)</option>
                                <option value="feminine">Feminine (die)</option>
                                <option value="neuter">Neuter (das)</option>
                                <option value="plural_only">Plural Only</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Level *</label>
                            <select id="fLevel" required>
                                <option value="A1">A1</option>
                                <option value="A2">A2</option>
                                <option value="B1">B1</option>
                                <option value="B2">B2</option>
                                <option value="C1">C1</option>
                                <option value="C2">C2</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Plural</label>
                            <input type="text" id="fPlural">
                        </div>
                        <div class="form-group">
                            <label>Genitive Singular</label>
                            <input type="text" id="fGenitive">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Translation (English) *</label>
                        <input type="text" id="fTranslation" required>
                    </div>
                    <div class="form-group">
                        <label>Example Sentence (German)</label>
                        <textarea id="fExampleDe" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Example Sentence (English)</label>
                        <textarea id="fExampleEn" rows="2"></textarea>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="fNDek">
                        <label for="fNDek">N-Deklination (weak noun)</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-green" onclick="submitForm()">Save</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/german-vocabulary/nomen/nomen.js"></script>
</body>

</html>
