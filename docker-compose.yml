services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fiber-vue-crud-demo:latest
    container_name: fiber-vue-crud-demo
    restart: unless-stopped
    ports:
      - "9001:9001"
    env_file:
      - .env.docker
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 9001
    networks:
      - sql-database

networks:
  sql-database:
    name: sql-database-network
    external: true
